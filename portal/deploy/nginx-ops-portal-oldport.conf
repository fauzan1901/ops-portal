# Old ONTAP Restore address (port __OLD_PORT__): every page goes to the Ops Portal, ONTAP Restore module.
server {
    listen __OLD_PORT__ ssl;
    listen [::]:__OLD_PORT__ ssl;
    listen 127.0.0.1:__OLD_PROXY_PORT__ ssl proxy_protocol;
    server_name _;
    ssl_certificate     /etc/ops-portal/tls/server.crt;
    ssl_certificate_key /etc/ops-portal/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://__TARGET__/ontap/;
    location = /healthz { return 200 "moved to https://__TARGET__/ontap/\n"; }
    location / { return 301 https://__TARGET__/ontap/; }
}
