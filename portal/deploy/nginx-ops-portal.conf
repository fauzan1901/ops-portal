# Ops Portal: HTTPS on __WEB_PORT__ -> gunicorn 127.0.0.1:__APP_PORT__ (written by install.sh).
server {
    listen __WEB_PORT__ ssl;
    listen [::]:__WEB_PORT__ ssl;
    # The bastion's Windows port forwarder (PortalProxy) connects here with the PROXY protocol: the real client address,
    # and for a browser on the bastion itself its Remote Desktop session (TLV 0xE0, passed on as X-Portal-Client).
    listen 127.0.0.1:__PROXY_PORT__ ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name _;

    ssl_certificate     /etc/ops-portal/tls/server.crt;
    ssl_certificate_key /etc/ops-portal/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    error_page 497 https://$host:__WEB_PORT__$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    location = /healthz { proxy_pass http://127.0.0.1:__APP_PORT__; }

    location / {
        # One name for the portal (Duo SSO returns to it): another name or the IP is redirected.
__CANONICAL__
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Portal-Client $proxy_protocol_tlv_0xe0;   # always set by nginx, never taken from the browser
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
