# One OpenStack command on the director: management host --ssh--> director, source overcloudrc, then os_command.
# Input: os_label, os_command (values inside it are already quoted), os_secret (hide the output from the log),
# os_optional (the command may fail; the caller reads os_out.rc itself).
# The raw module is used so the management host does not need Python.
- name: "OpenStack: {{ os_label }}"
  ansible.builtin.raw: "{{ director_prefix }} {{ ('source ' ~ overcloudrc ~ ' && ' ~ os_command) | quote }}"
  delegate_to: mgmt
  register: os_out
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: "{{ os_secret | default(false) | bool }}"

- name: "Check result: {{ os_label }}"
  vars:
    # Drop irrelevant ssh warnings (new host key recorded, post-quantum) so the error message stays short.
    os_err: >-
      {{ ((os_out.stderr | default('') | trim) or (os_out.msg | default('') | trim)).splitlines()
         | map('trim') | reject('search', 'Permanently added|post-quantum|store now, decrypt later|may need to be upgraded')
         | map('regex_replace', '^Task failed: Failed to connect to the host via ssh: ', '') | select | join(' ') }}
    # ssh to the director exits with code 255, which Ansible treats as "management host unreachable".
    director_denied: "{{ ('@' ~ cfg.director.host ~ ': Permission denied') in os_err }}"
  ansible.builtin.assert:
    that:
      - not (os_out.unreachable | default(false))
      - os_out.rc | default(1) == 0
    fail_msg: >-
      {% if director_denied | bool %}{{ os_label }} failed: management host {{ cfg.mgmt.host }} is reachable, but the login
      to director {{ cfg.director.user }}@{{ cfg.director.host }} was denied (Permission denied). Check director.user in
      sites.yml (TripleO directors usually use the stack user) and the key of user {{ cfg.mgmt.user | default('') }} on the management host.
      {% else %}{{ os_label }} failed{{ ' (management host not reachable)' if os_out.unreachable | default(false) else '' }}:
      {{ (os_err or ('' if os_secret | default(false) | bool else os_out.stdout | default('') | trim)) | truncate(800) }}{% endif %}
    quiet: true
  when: not (os_optional | default(false) | bool)
