# Operation Automation catalog: every work instruction of the Knowledge Base (kb.example.com, collective "Knowledge
# Based") and what the portal checks for it. Read when the portal starts; edit, then restart the portal.
#
# status   ready    the check runs (read-only)
#          planned  designed, waits for access or a client (see reason)
#          manual   nothing to read automatically (a change, a customer device, a UI action): the WI is the guide
#          module   done by another portal module (link)
# needs    access the check cannot run without: openstack, undercloud (the director with stackrc), ontap (the ONTAP
#          Restore account of the site), ro-vcenter, ro-nsxt, ro-vcd, hosts:<group> (hosts:bmc = the page BMC)
# uses     optional access: steps that need it are skipped without it
# params   name, label, type (int, text, uuid, uuid_list, uuid_or_name, project, ip, ip_list, port, cidr, host, service,
#          ip_port, select), required, default, min/max, options (select), groups (host), help, mode (instance|ip)
# does     what the check does, in one plain sentence (at most 100 characters): shown under its title in the lists
# fix      true: a result can offer a fix the portal runs (after confirmation) — the badge "Check + fix" / "Makes a change"
# collect  true: it collects files to download (log bundles, exports) — the badge "Collects files"
# wi       Knowledge Base pages (page id from the collective, title)
# basis    platform: a health check of the platform itself, not from a Knowledge Base page (wi is empty)
# activity what the operator wants to do (left menu, filters): troubleshoot (a problem of a WI, the default), health
#          (the default of basis platform), operations (a planned change and its pre / post-check), logs (read, collect
#          or export logs and events)

# categories: one page per product in the left menu. icon = a symbol of the portal sprite (templates/_sprite.html);
# short = the name in the menu when the title is too long for one line (the title is its tooltip).
categories:
  - {id: flex, short: "Acme Flex", title: "Acme Flex (OpenStack)", icon: cloud, summary: "Cinder pools, volume types, quota, stuck instances and volumes, attach, instance network and ports."}
  - {id: netapp, title: "NetApp ONTAP", icon: database, summary: "Cluster health, LIFs on their home ports, restore of an OpenStack volume."}
  - {id: prime, short: "Acme Prime", title: "Acme Prime (VMware)", icon: server, summary: "Datastores, host load and resource pools, vCloud VMs and edge gateways, NSX-T SNAT."}
  - {id: cdn, title: "Acme CDN", icon: network, summary: "Disk and memory alerts of the CDN VMs, Grafana datasource, repository website, Varnish MSE."}
  - {id: dns, title: "Acme DNS", icon: search, summary: "Recursor query logging that fills the disk."}
  - {id: network, short: "Network", title: "Network (VyOS, NSX-T, Huawei, ACI)", icon: network, summary: "VyOS NAT and routes, VyOS upgrade, Huawei BGP prefixes, Linux firewall behind NSX-T, ACI static ports."}
  - {id: siem, short: "SIEM", title: "SIEM log collection", icon: list, summary: "rsyslog forwarders, the collector, ESXi and Windows log sources."}
  - {id: linux, short: "Linux VM", title: "Linux VM (Acme Tolong)", icon: terminal, summary: "Services and ports inside a VM, emergency mode and login recovery."}
  - {id: gb200, title: "GB200", icon: cubes, summary: "Compute tray NIC links and NVLink switches."}
  - {id: box, title: "Acme Box", icon: database, summary: "File transfer issues of Acme Box."}
  - {id: hardware, title: "Servers (BMC)", icon: server, summary: "Hardware health of the servers through their BMC (Redfish): power supplies, fans, temperatures, memory, disks, event log."}

# symptoms: the home page "What is the problem?": what the operator sees, and the checks to run for it (in order)
symptoms:
  - {id: vm-unreachable, title: "Customer cannot reach a VM", icon: network, checks: [instance-network, custom-port-tcp, ovn-fdb-learning, linux-firewall]}
  - {id: cannot-create, title: "Cannot create a VM, volume or IP", icon: plus, checks: [project-quota, compute-capacity, openstack-services]}
  - {id: stuck, title: "A VM or volume is stuck", icon: in-progress, checks: [stuck-resources, volume-attach]}
  - {id: snapshot-fails, title: "Snapshot, resize or backup fails", icon: copy, checks: [volume-type-legacy, ontap-capacity]}
  - {id: storage-full, title: "Storage almost full", icon: database, checks: [cinder-pool-usage, ontap-capacity, ontap-volume-lun-state, vcenter-datastore]}
  - {id: storage-io, title: "Volumes with I/O errors or LUN offline", icon: alert, checks: [ontap-volume-lun-state, ontap-ha-redundancy, ontap-cluster-health]}
  - {id: openstack-failing, title: "OpenStack is slow or failing", icon: cloud, checks: [openstack-services, pacemaker-health, ovn-db-cluster, rabbitmq-queues, galera-wsrep, overcloud-node-health, overcloud-logs]}
  - {id: hardware, title: "A server or its hardware fails", icon: server, checks: [bmc-health, ironic-nodes, vcenter-health]}
  - {id: prime-vm, title: "A Acme Prime VM does not start or is slow", icon: cubes, checks: [vcd-vm-power, vmware-host-usage, vcenter-health]}
  - {id: prime-network, title: "Customer VPN, NAT or edge (Acme Prime)", icon: lock, checks: [vcd-edge, nsxt-snat-priority, nsxt-gateway-routing, nsxt-health, mikrotik-ipsec]}
  - {id: prime-platform, title: "Acme Prime portal or vCenter fails", icon: server, checks: [vcd-platform, vcenter-appliance, vcenter-health, nsxt-health]}
  - {id: vyos, title: "NAT or route on a VyOS gateway", icon: network, checks: [vyos-nat-firewall, vyos-static-route]}
  - {id: cdn-alert, title: "Acme CDN alert (disk, memory, Grafana, website)", icon: bell, checks: [cdn-disk-run, cdn-root-disk, cdn-memory, cdn-datasource, cdn-repo]}
  - {id: service-down, title: "A service on a Linux VM does not answer", icon: terminal, checks: [linux-service-port, linux-firewall, linux-resources]}
  - {id: siem-missing, title: "Logs are missing in the SIEM", icon: list, checks: [siem-forwarder, siem-collector, esxi-syslog]}
  - {id: dns-alert, title: "DNS recursor alert", icon: search, checks: [dns-recursor-syslog]}
  - {id: cert, title: "A certificate expires soon", icon: key, checks: [cert-expiry, cert-inventory, certmonger-status]}
  - {id: vendor-case, title: "Logs for a vendor support case", icon: download, checks: [collect-logs, sos-report, ontap-ems-export, vcenter-events-export, bmc-log-export]}

checks:
  # ------------------------------------------------------------------ Acme Flex (OpenStack)
  - id: cinder-pool-usage
    category: flex
    title: Cinder volume over 80%
    does: "Finds full Cinder pools and moves volumes to a pool with room"
    fix: true
    summary: Used space of every Cinder pool (ONTAP FlexVol, else Cinder total - free; not the overcommitted allocation), the volumes and snapshots older than 2 weeks in the pools above the threshold, and where to migrate them — tick the volumes to migrate one at a time (a volume with snapshots migrates after its approved snapshots are deleted; a failed migration is cleaned up and the next pool is tried).
    status: ready
    needs: [openstack]
    uses: [ontap]
    wi: [{page: 5546, title: "Cinder Volume Over 80%"}]
    steps: [Identify the affected Cinder pools, Volumes in the affected pools, Migration target, Evaluate snapshots]
    params:
      - {name: threshold, label: "Alert threshold (%)", type: int, default: 80, min: 50, max: 99, help: "The Grafana alert fires at 80%. Pools 10% below are an early warning."}
      - {name: pool, label: "Cinder pool (optional)", type: text, pattern: "^[A-Za-z0-9_.@#-]{1,128}$", help: "Part of the pool name, e.g. DCAOPNSTACK_CINDER_10. Empty = all pools."}
      - {name: snapshot_days, label: "Snapshots to clean up: older than (days)", type: int, default: 14, min: 1, max: 365, help: "Only snapshots older than this are offered for deletion (after the volume owner confirms)."}

  - id: volume-type-legacy
    category: flex
    title: Volumes on an old volume type
    does: "Finds volumes on old types and changes their type (approved snapshots deleted first)"
    fix: true
    summary: Volumes that still use an old type (standard, basic, premium) — snapshots, root disk resize and the Backup Scheduler fail on them.
    status: ready
    needs: [openstack]
    wi:
      - {page: 5531, title: "Volume Snapshot Error on the Backend (Horizon Portal)"}
      - {page: 5538, title: "VM Fails to Resize Root Disk"}
      - {page: 5540, title: "Backup Scheduler Does Not Run Snapshots"}
    steps: [Find the project, Old volume types of this site, Volumes on an old type]
    params:
      - {name: project, label: "Project (ID or name, optional)", type: project, help: "Empty = every project of the site."}

  - id: project-quota
    category: flex
    title: Project quota full
    does: "Shows which quota of a project is full and raises it"
    fix: true
    summary: Quota use of one project (instances, vCPU, RAM, volumes, GiB, snapshots, ports, floating IPs).
    status: ready
    needs: [openstack]
    wi:
      - {page: 5532, title: "Failed to Create a New Instance"}
      - {page: 5538, title: "VM Fails to Resize Root Disk"}
    steps: [Find the project, Compute quota, Block storage quota, Network quota]
    params:
      - {name: project, label: "Project (ID or name)", type: project, required: true}

  - id: stuck-resources
    category: flex
    title: Instances or volumes stuck
    does: "Finds VMs and volumes stuck in BUILD, ERROR or attaching and cleans them up"
    fix: true
    summary: Instances in BUILD or ERROR, volumes stuck attaching/detaching/reserved, and volume retypes that did not finish.
    status: ready
    needs: [openstack]
    wi:
      - {page: 5541, title: "Instance Stuck in Building Status"}
      - {page: 5544, title: "Rollback Volume Type"}
    steps: [Instances in BUILD, Instances in ERROR, Volumes in a transitional state, Volumes in an error state, Volume migrations / retypes not finished, Old failed migrations (marker only)]
    params:
      - {name: older_than, label: "Stuck for at least (minutes)", type: int, default: 30, min: 5, max: 10080}
      - {name: project, label: "Project (ID or name, optional)", type: project, help: "Instances of this project only. Empty = every project."}

  - id: volume-attach
    category: flex
    title: Volume cannot be attached again
    does: "Finds where a volume is still attached and frees it to attach again"
    fix: true
    summary: Where the volume is still attached in OpenStack (although the Service Portal shows it detached), the state of that instance, and the exact detach / reset / attach commands.
    status: ready
    needs: [openstack]
    wi:
      - {page: 5535, title: "Volume Cannot Be Attached Again"}
      - {page: 5534, title: "Storage Cannot Be Attached Again After Being Detached in the Service Portal"}
    steps: [Volume status in Cinder, Still attached in Horizon, Instance to attach to]
    params:
      - {name: volume, label: "Volume ID", type: uuid, required: true}
      - {name: instance, label: "Instance to attach to (optional)", type: uuid, help: "The instance the customer wants the volume on. Gives the exact attach command."}

  - id: instance-network
    category: flex
    title: Instance cannot be reached
    does: "Checks the path to a VM: status, ports, floating IP, security groups, TCP test"
    fix: true
    summary: Status and compute of an instance, its ports, floating IPs, security group rules for a port and ICMP, subnet room, and a TCP test from the portal server.
    status: ready
    needs: [openstack]
    wi:
      - {page: 5537, title: "Instance Cannot Connect (SSH, HTTPS, Ping, etc.)"}
      - {page: 5539, title: "Floating IP Cannot Be Attached to a VPC Instance Interface"}
      - {page: 5536, title: "Instance Cannot Connect Through the Metro Network (VPC Simple Normal)"}
    steps: [Instance status in Acme Flex, Network interfaces and floating IPs, Security groups allow the port, Security groups allow ping, Free addresses in the subnets, TCP test from the portal server]
    params:
      - {name: instance, label: "Instance ID", type: uuid, required: true}
      - {name: port, label: "Port (optional)", type: port, help: "e.g. 22 (SSH), 443 (HTTPS), 6600. Checks the security groups for it."}
      - {name: probe_ip, label: "Test TCP to (optional)", type: ip, help: "Usually the floating IP. Needs the port."}

  - id: ovn-fdb-learning
    category: flex
    title: Instances on one network cannot reach a host (OVN FDB learning)
    does: "Finds why VMs on one network lose traffic to a host, clears it, turns port security on"
    fix: true
    summary: "Unicast lost while ARP broadcast passes, depending on which instances share a compute: the ports of the instances (port security), their OVN port bindings (\"unknown\" address) and the FDB of their networks in the OVN Southbound DB, read only. Finds the MACs recorded on a port they do not belong to, clears them (Run this fix) and turns port security on port by port (Run this fix: an allow-all security group, the VIPs of the form)."
    status: ready
    needs: [openstack]
    wi:
      - {title: "FDB Learning Issue"}
    steps: [Instances and their computes, Ports of the instances, Network backend, OVN Southbound DB (read from an overcloud node), Networks and their OVN datapath, OVN port bindings of the instances, FDB entries of the networks, Frames with a foreign source MAC, Other networks, Addresses to allow when port security goes on]
    params:
      - {name: instances, label: "Instance IDs", type: uuid_list, required: true, max: 16, help: "Every instance involved (the ones that fail and the ones that work), from any compute: add a row per instance, or paste several IDs at once. At most 16."}
      - {name: dest_ip, label: "Destination IP (optional)", type: ip, help: "The address the instances cannot reach, e.g. 10.249.11.27: its FDB entry is marked."}
      - {name: capture_seconds, label: "Capture on the taps, seconds (optional)", type: int, default: 0, min: 0, max: 30, help: "0 = off. A few seconds of tcpdump on the tap of each instance: frames it sends with a MAC that is not its own (what fills the FDB)."}
      - {name: vips, label: "VIPs / allowed addresses (optional)", type: ip_list, max: 16, help: "Only for the permanent fix (port security on): every VIP or other address the instances answer for, e.g. 10.249.11.50, 10.249.11.51. They become allowed address pairs of every port; the result lists the candidates it finds. Empty = none."}

  - id: custom-port-tcp
    category: flex
    title: "Alert: Custom Port TCP <SITE> <PORT> is DOWN"
    does: "Tests the port of an UptimeRobot alert and finds the VM and rule behind it"
    fix: true
    summary: From the IP and port of the UptimeRobot alert — TCP test, which instance owns the IP, its status, and the security groups.
    status: ready
    needs: [openstack]
    wi: [{page: 6924, title: "WI_custom_port_tcp_down"}]
    steps: [Find the instance of the IP, Instance status in Acme Flex, Network interfaces and floating IPs, Security groups allow the port, TCP test from the portal server]
    params:
      - {name: ip, label: "IP address of the alert", type: ip, required: true}
      - {name: port, label: "Port of the alert", type: port, required: true}

  - id: openstack-services
    category: flex
    title: OpenStack services and agents
    does: "Lists the OpenStack services and network agents that are down"
    summary: "Platform health (not from a KB page): nova and cinder services down, neutron agents dead (OVN / OVS), the instances on a compute whose nova-compute is down, old records of removed nodes, and the external address pools (floating IPs) that are filling up."
    status: ready
    needs: [openstack]
    basis: platform
    wi: []
    steps: [Compute services (nova), Block storage services (cinder), Network agents (neutron), External address pools]
    params:
      - {name: ip_warn, label: "Address pool warning at (%)", type: int, default: 85, min: 50, max: 99}
      - {name: ip_fail, label: "Address pool problem at (%)", type: int, default: 95, min: 50, max: 100}

  - id: ironic-nodes
    category: flex
    title: Bare metal nodes (BMC power state)
    does: "Shows overcloud servers powered off or in maintenance (through their BMC)"
    summary: "Platform health (not from a KB page): the overcloud nodes as the undercloud (ironic) reads them through their BMC — powered off while deployed, maintenance, fault 'power failure' (BMC not answering: Pacemaker cannot fence that controller either)."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Bare metal nodes (ironic, through the BMC)]
    params: []

  - id: pacemaker-health
    category: flex
    title: Pacemaker and fencing (controllers)
    does: "Checks the controller cluster: quorum, Galera, RabbitMQ, HAProxy, fencing"
    summary: "Platform health (not from a KB page): pcs status of the controllers (quorum, offline / unclean nodes, Galera, RabbitMQ, Redis, HAProxy, OVN DB bundles, VIPs, cinder-volume), failed actions, fencing (stonith-enabled, stonith devices, failed and past fencing), RabbitMQ partitions and alarms, time sync. Read on the controllers through the director."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Controllers reached from the director, Cluster quorum and nodes, Cluster resources, Failed resource actions, Fencing (STONITH), RabbitMQ cluster, Time sync of the controllers, Cluster daemons]
    params: []

  - id: ovn-db-cluster
    category: flex
    title: OVN database cluster (NB / SB, northd)
    does: "Checks the OVN databases of the controllers: leader, members, northd and size"
    summary: "Platform health (RISET-KNOWN-ISSUES 2.1): the OVN Northbound and Southbound databases of the controllers — on RHOSP 17.x RAFT clusters that Pacemaker no longer manages (leader, term, members, a removed controller still a member), on 16.2 the active / backup of ovn-dbs-bundle — ovn-northd active on one controller, and the size of the databases and of MAC_Binding. Read only, on the controllers through the director."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Controllers reached from the director, How the OVN databases are run, OVN Northbound database, OVN Southbound database, ovn-northd, Size of the databases and MAC_Binding]
    params: []

  - id: rabbitmq-queues
    category: flex
    title: RabbitMQ queues and limits
    does: "Finds RabbitMQ queues that grow or have no consumer, and nodes near their limits"
    summary: "Platform health (RISET-KNOWN-ISSUES 2.2): the queues of the RabbitMQ cluster with their messages and consumers (1000 messages or more, messages without a consumer, notification queues no service reads) and the file descriptors and sockets of each controller. Read only; purging a queue stays a command for the engineer."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Controllers reached from the director, File descriptors and sockets, Queues that grow or have no consumer]
    params: []

  - id: galera-wsrep
    category: flex
    title: Galera replication and connections
    does: "Checks Galera on the controllers: Synced, Primary, flow control, connections"
    summary: "Platform health (RISET-KNOWN-ISSUES 2.2): wsrep of each controller — cluster size, Primary component, Synced state, flow control and receive queue — and the connections against max_connections (\"Too many connections\"). Read with the root option file of the galera container: no password passes through the portal."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Controllers reached from the director, Galera replication and connections]
    params: []

  - id: certmonger-status
    category: flex
    title: certmonger certificates (TLS everywhere) on the director and nodes
    does: "Checks certmonger certificates on the director and nodes; renews the ones you tick"
    fix: true
    summary: "Platform health (RISET-KNOWN-ISSUES 2.2): every certificate certmonger tracks (getcert list) on the director and on the controllers, the computes or every node — its status (only MONITORING is healthy: CA_UNREACHABLE means IdM cannot renew it) and the days left. Tick the requests of the nodes to resubmit: one at a time, each followed until certmonger monitors its new certificate. Without TLS everywhere nothing is tracked; the public endpoint is the check Certificates expiring."
    status: ready
    needs: [undercloud]
    basis: platform
    wi: []
    steps: [Director (undercloud) certmonger certificates, Nodes reached from the director, Overcloud certmonger certificates]
    params:
      - {name: role, label: "Nodes", type: select, options: [controller, compute, all], default: controller}
      - {name: warn_days, label: "Warning within (days)", type: int, default: 30, min: 7, max: 365}
      - {name: fail_days, label: "Problem within (days)", type: int, default: 7, min: 0, max: 60}

  - id: overcloud-logs
    category: flex
    activity: logs
    title: Overcloud logs (errors and known problems)
    does: "Reads the recent errors in the OpenStack logs and explains the known ones"
    summary: "Platform health (not from a KB page): the warning / error lines of the last hours on the controllers (and the compute of an instance, or one node): nova, neutron / OVN, cinder, keystone, glance, RabbitMQ, Galera, HAProxy, Pacemaker / corosync and the kernel. Known problems are recognised and linked to Red Hat; for an instance, its request IDs are followed through the logs (timeline)."
    status: ready
    needs: [undercloud]
    uses: [openstack]
    basis: platform
    wi: []
    steps: [Overcloud nodes, Known problems in the logs, Other errors, Timeline of the instance's requests]
    params:
      - {name: component, label: "Logs of", type: select, options: [all, nova, neutron, cinder, keystone, glance, rabbitmq, galera, haproxy, pacemaker, kernel], default: all}
      - {name: hours, label: "Last (hours)", type: int, default: 6, min: 1, max: 72}
      - {name: instance, label: "Instance ID (optional)", type: uuid, help: "Follows this instance and the request IDs of its actions (openstack server event list) through nova, neutron and cinder; reads its compute too."}
      - {name: request_id, label: "Request ID (optional)", type: text, pattern: "^req-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", help: "e.g. from an error in Horizon or the API: req-…"}
      - {name: node, label: "Only this node (optional)", type: text, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$", help: "An overcloud node name, e.g. overcloud-novacompute-3. Empty = the controllers."}

  - id: collect-logs
    category: flex
    activity: logs
    title: Collect logs (overcloud nodes, full log bundle)
    does: "Packs the logs of the OpenStack nodes for a time window into one file"
    collect: true
    summary: "Log collection (permission collect logs; not from a KB page): every log line of a time window on the controllers, the computes or named nodes — nova, placement, libvirt / QEMU, neutron, OVN / Open vSwitch, cinder, glance, keystone, heat, Horizon, RabbitMQ, Galera, HAProxy, Pacemaker / corosync, iscsid / multipathd, the kernel and /var/log/messages, rotated files included, tracebacks kept whole — as one bundle to download (one .tar.gz per node, MANIFEST). Secrets are masked on the node before the lines leave it; nothing is left on the nodes. The bundle is kept 7 days on the portal server."
    status: ready
    needs: [undercloud]
    uses: [openstack]
    basis: platform
    permission: wi-logs
    bundle: true
    timeout_minutes: 120
    wi: []
    steps: [Overcloud nodes, Room on the nodes, Logs collected per node, Files in the bundle]
    params:
      - {name: scope, label: "Nodes", type: select, options: [controllers, computes, all, named], default: controllers, help: "named = only the nodes in Node names. At most 12 nodes per run."}
      - {name: nodes, label: "Node names (optional)", type: text, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}(,[A-Za-z0-9][A-Za-z0-9_.-]{0,62}){0,11}$", help: "Comma-separated, added to the choice above, e.g. overcloud-novacompute-3,overcloud-novacompute-7"}
      - {name: instance, label: "Instance ID (optional)", type: uuid, help: "Adds the compute the instance runs on."}
      - {name: preset, label: "Logs of", type: select, options: [all, compute, network, storage, controlplane, nova, placement, libvirt, neutron, ovn, cinder, glance, keystone, heat, horizon, rabbitmq, galera, haproxy, pacemaker, iscsi, kernel, system], default: all, help: "compute = nova, libvirt, neutron, OVN, iscsid, kernel, messages; network = neutron, OVN, HAProxy, kernel, messages; storage = cinder, glance, nova, iscsid, kernel, messages; controlplane = the API services, RabbitMQ, Galera, HAProxy, Pacemaker, messages."}
      - {name: hours, label: "Time window (hours)", type: int, default: 6, min: 1, max: 72}
      - {name: until, label: "Window ends at (optional)", type: text, pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}$", help: "Site time, YYYY-MM-DD HH:MM (e.g. just after the incident). Empty = now."}
      - {name: max_mb, label: "At most per node (MB, uncompressed)", type: int, default: 1024, min: 50, max: 4096, help: "When reached, the oldest rotated files are left out (listed in MANIFEST.txt)."}

  - id: sos-report
    category: flex
    activity: logs
    title: sos report for Red Hat support (overcloud nodes)
    does: "Makes Red Hat sos reports of up to 4 nodes for a support case"
    collect: true
    summary: "Log collection (permission collect logs; not from a KB page): Red Hat's own sos report (sos report --batch) on up to 4 overcloud nodes, one after the other, with the case number when given, the archives in one bundle to download and attach to the Red Hat case. Each node needs 5 GB free in /var/tmp (10 GB with all logs); the archive is streamed to the portal server and removed from the node. Kept 7 days."
    status: ready
    needs: [undercloud]
    uses: [openstack]
    basis: platform
    permission: wi-logs
    bundle: true
    timeout_minutes: 240
    wi: []
    steps: [Overcloud nodes, Room on the nodes and sos installed, sos report per node]
    params:
      - {name: scope, label: "Nodes", type: select, options: [named, controllers], default: named, help: "At most 4 nodes per run (sos report loads each node for several minutes)."}
      - {name: nodes, label: "Node names", type: text, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}(,[A-Za-z0-9][A-Za-z0-9_.-]{0,62}){0,3}$", help: "Comma-separated, e.g. overcloud-controller-0,overcloud-novacompute-3"}
      - {name: instance, label: "Instance ID (optional)", type: uuid, help: "Adds the compute the instance runs on."}
