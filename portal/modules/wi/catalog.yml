  - id: vyos-upgrade
    category: network
    activity: operations
    title: VyOS upgrade (image from the jump host)
    does: "Upgrades a VyOS with its config backup, reboot and checks before and after"
    fix: true
    summary: "WI VyOS Upgrade + CVE Mitigation, run from the portal: the VyOS (management IP, reached through its jump host on Hosts & SSH) is read — version, hw-id of every interface, room, images, dropbear keys, the baseline (interfaces, gateway, routes, NAT). Upgrade VyOS then runs the WI step by step: backup of the configuration to the jump host (none kept on the VyOS), hw-id, the image copied with scp from the jump host and its sha256 compared, add system image (Yes to every yes/no question, the proposed value to the others), new dropbear key (CVE-2025-30095), reboot, SSH again within 15 minutes, post-check against the baseline. After it, Roll back to the previous image is offered."
    status: ready
    needs: [hosts:vyos]
    wi: [{page: 8398, title: "WI VyOS Upgrade + CVE Mitigation"}]
    steps: [Jump host and image, Current version, hw-id on every ethernet interface (WI 2.2), Room for the image, Installed images, "CVE-2025-30095: dropbear keys (WI 2.4)", Baseline for the post-check]
    params:
      - {name: host, label: "VyOS to upgrade", type: host, groups: [vyos], required: true, help: "A VyOS of Hosts & SSH with its management IP and Connect through = the jump host that holds the image (e.g. 11.6.215.125)."}
      - {name: image, label: "Image on the jump host", type: text, default: "/home/vyos/vyos-2026.03-generic-amd64.iso", pattern: "^/[A-Za-z0-9_./-]{1,200}\\.iso$", help: "Path of the ISO on the jump host; its name gives the version (vyos-<version>-generic-amd64.iso)."}
      - {name: backup_dir, label: "Configuration backup folder on the jump host", type: text, default: "/home/vyos/config-backup", pattern: "^/[A-Za-z0-9_./-]{1,200}$", help: "Before anything changes, /config/config.boot of the VyOS is copied here (one folder per VyOS, file mode 600, sha256 compared); no copy is kept on the VyOS."}
      - {name: wait_minutes, label: "Wait for SSH after the reboot (minutes)", type: int, default: 15, min: 5, max: 60, help: "SSH is tried every 15 seconds; when the VyOS does not answer in time, the fix fails with the console rollback steps."}

