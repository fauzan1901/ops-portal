  - id: compute-drain
    category: flex
    activity: operations
    title: Live migrate instances of a compute (choose the instances)
    does: "Moves the VMs off a compute (live or cold migration), one by one"
    fix: true
    summary: "Platform operation (not from a KB page): the list of instances on one compute, read at once (one server list), and the real CPU / RAM use of the other computes; tick the instances to move and start — the running ones are live-migrated, the shut-off ones cold-migrated, one at a time, each to the least used compute whose CPU and RAM stay under 70% (read right before each migration; none: the instance is not moved), each followed until it ends: a destination that refuses is replaced by the next, a migration that does not finish is aborted (or forced), an instance left in ERROR is reset only after virsh shows where it runs. Disable / enable the compute when it is emptied for maintenance."
    status: ready
    needs: [openstack]
    uses: [undercloud]
    basis: platform
    wi: []
    steps: [The compute, Instances on the compute, "Destinations: CPU and RAM under the limit"]
    params:
      - {name: compute, label: "Compute", type: text, required: true, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$", help: "The host as in openstack compute service list, e.g. overcloud-novacompute-7.localdomain. Its instances are listed; you tick the ones to move."}
      - {name: max_usage, label: "Destinations: CPU and RAM under (%)", type: int, default: 70, min: 30, max: 95, help: "Real use, read on each compute right before each migration (RAM with the instance). The least used compute under this takes the instance; none: it is not moved."}
      - {name: target, label: "Destination compute (optional)", type: text, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$", help: "Empty = the least used compute under the limit (recommended). Named: only that compute, while it is under the limit."}
      - {name: timeout_minutes, label: "Time limit per instance (minutes)", type: int, default: 60, min: 5, max: 480, help: "A live migration still running after this is aborted (or forced to complete)."}
      - {name: stall, label: "When a live migration does not finish in time", type: select, options: ["abort", "force-complete"], default: "abort", help: "abort: the instance keeps running on its compute. force-complete: the instance pauses until the memory copy ends."}
      - {name: on_failure, label: "When an instance cannot be migrated", type: select, options: ["stop", "continue"], default: "stop", help: "stop: the run stops there. continue: it is skipped (an instance that needs a person always stops the run)."}

