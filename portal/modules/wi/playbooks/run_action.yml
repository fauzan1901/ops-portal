# Operation Automation: one fix from a check result (or the connection test of a host on Hosts & SSH).
# Only the commands the analysis generated for that result run (the portal never passes text from the browser):
#   host   on the host of the run, with its portal SSH credential (sites.yml hosts stay read-only), one script, each
#          command between markers, stopping at the first one that fails
#   ontap  revert the cluster management LIF to its home port (REST PATCH) with the ONTAP Restore account of the site,
#          through the cluster management address or, when that does not answer, a node management address
#   openstack  the generated OpenStack commands as admin on the director of the site (management host -> director ->
#          source overcloudrc), each checked against wi_analysis.OPENSTACK_FIX, stopping at the first that fails;
#          with selected items (action_items: instances, volumes, images ticked in the result), one script per item,
#          one item after the other (tasks/openstack_item.yml), stopping as action_stop_rcs says
#
# Vars: site, run_id, action_kind, action_title, raw_file (the full output, kept 7 days); host: host_target, action_commands, action_shell (sh|vyos),
#       action_strip_sudo; openstack: action_commands, action_items [{label, commands}], action_stop_rcs; ontap: ontap_op, ontap_lif, ontap_lif_uuid, ontap_enable, ontap_hosts, ontap_validate_certs.
# Secrets in the environment only: WI_SSH_SECRET (private key or password), WI_ONTAP_FIX_USER / WI_ONTAP_FIX_PASSWORD.
- name: "Operation Automation fix: {{ action_title | default('') }}"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: fix
      block:
        - name: Validate input
          ansible.builtin.assert:
            that:
              - action_kind | default('') in ['host', 'ontap', 'openstack', 'vyos_upgrade', 'vyos_rollback']
              - action_kind not in ['vyos_upgrade', 'vyos_rollback'] or (vu is defined and host_target.jump is defined)
              - action_kind not in ['host', 'openstack'] or (action_commands | default([]) | length) > 0
              - action_kind != 'openstack' or (sites is defined and site | default('') in sites)
              - action_kind != 'ontap' or ontap_lif_uuid | default('') is match('^[0-9a-f-]{36}$')
            fail_msg: "Invalid fix."
            quiet: true

        - name: Host connection
          ansible.builtin.include_tasks: tasks/host_setup.yml
          when: action_kind in ['host', 'vyos_upgrade', 'vyos_rollback']

        - name: VyOS upgrade / roll back (WI VyOS Upgrade + CVE Mitigation)
          ansible.builtin.include_tasks: tasks/vyos_upgrade.yml
          when: action_kind in ['vyos_upgrade', 'vyos_rollback']

        - name: "Fix on {{ host_target.name | default('') }}: {{ action_commands | default([]) | length }} command(s)"
          vars:
            action_script: "{{ action_commands | wi_action_script(action_shell | default('sh'), action_strip_sudo | default(false)) }}"
          ansible.builtin.raw: "{{ (host_prefix ~ ' ' ~ (action_script | quote)) if host_prefix else action_script }}"
          delegate_to: wi_target
          register: action_out
          changed_when: true
          failed_when: false
          ignore_unreachable: true
          when: action_kind == 'host'

        - name: Result of the fix
          ansible.builtin.set_fact:
            job_result: "{{ action_out | wi_action_result(action_commands, host_target | default({})) }}"
          when: action_kind == 'host'

        - name: ONTAP fix
          ansible.builtin.include_tasks: tasks/ontap_fix.yml
          when: action_kind == 'ontap'

        - name: OpenStack of the site
          ansible.builtin.set_fact:
            cfg: "{{ sites[site] }}"
          when: action_kind == 'openstack'

        - name: OpenStack connection (management host -> director)
          ansible.builtin.include_tasks: tasks/openstack_setup.yml
          when: action_kind == 'openstack'

        - name: "Fix on OpenStack {{ site | default('') }}: {{ action_commands | default([]) | length }} command(s)"
          ansible.builtin.raw: "{{ director_prefix }} {{ (action_commands | wi_os_action_script(overcloudrc)) | quote }}"
          delegate_to: mgmt
          register: action_os_out
          changed_when: true
          failed_when: false
          ignore_unreachable: true
          when: action_kind == 'openstack' and not (action_items | default([]))

        - name: Result of the OpenStack fix
          ansible.builtin.set_fact:
            job_result: "{{ action_os_out | wi_action_result(action_commands) }}"
          when: action_kind == 'openstack' and not (action_items | default([]))

        - name: "OpenStack {{ site | default('') }}: {{ action_items | default([]) | length }} item(s), one after the other"
          ansible.builtin.include_tasks: tasks/openstack_item.yml
          loop: "{{ action_items | default([]) }}"
          loop_control:
            loop_var: wi_item
            index_var: wi_index
            label: "{{ wi_item.label }}"
          when: action_kind == 'openstack' and (action_items | default([]) | length) > 0

        - name: Result of the OpenStack items
          ansible.builtin.set_fact:
            job_result: "{{ wi_item_results | default([]) | wi_items_result(action_items) }}"
          when: action_kind == 'openstack' and (action_items | default([]) | length) > 0

      rescue:
        - name: Build failure result
          ansible.builtin.set_fact:
            job_result:
              ok: false
              steps: []
              step: "{{ ansible_failed_task.name | default('') }}"
              error: "{{ ansible_failed_result.msg | default('no message') }}"

      always:
        - name: Remove the temporary SSH key files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ [wi_keyfile.path | default(''), wi_jumpkey.path | default('')] | select | list }}"

        - name: Keep the full output of the fix (masked by the portal)
          vars:
            # a skipped task still sets its register: the output of the task that ran
            fix_out: "{{ action_os_out if action_kind | default('') == 'openstack' else action_out | default({}) }}"
          ansible.builtin.copy:
            content: >-
              {{ {'stdout': fix_out.stdout | default(''), 'stderr': fix_out.stderr | default(fix_out.msg | default('')),
                  'items': wi_item_raw | default([])} | to_json }}
            dest: "{{ raw_file }}"
            mode: "0600"
          no_log: true
          failed_when: false
          when: raw_file | default('') | length > 0

        - name: Save result
          ansible.builtin.import_tasks: tasks/write_result.yml

    - name: End with failed status
      ansible.builtin.fail:
        msg: "{{ job_result.error | default('The fix failed.') }}"
      when: not (job_result.ok | default(false) | bool)
