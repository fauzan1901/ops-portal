# OpenStack of the site, the same way as ONTAP Restore: management host (SSH key) -> director (ssh without password,
# user stack on TripleO) -> source overcloudrc. Commands are checked by the filter wi_os_script (read-only allowlist).
- name: Validate the OpenStack configuration of {{ site }}
  ansible.builtin.assert:
    that:
      - (cfg.mgmt | default({})).host | default('') is match('^[A-Za-z0-9_.:-]+$')
      - (cfg.director | default({})).host | default('') is match('^[A-Za-z0-9_.:-]+$')
      - (cfg.director | default({})).user | default('') is match('^[A-Za-z0-9_.-]+$')
      - (cfg.director.overcloudrc | default('~/overcloudrc')) is match('^[~A-Za-z0-9_./-]+$')
      - (cfg.director.stackrc | default('~/stackrc')) is match('^[~A-Za-z0-9_./-]+$')
    fail_msg: "Site {{ site }} has no OpenStack access in sites.yml (mgmt.host, director.host, director.user)."
    quiet: true

- name: Prepare the director command
  ansible.builtin.set_fact:
    overcloudrc: "{{ cfg.director.overcloudrc | default('~/overcloudrc') }}"
    stackrc: "{{ cfg.director.stackrc | default('~/stackrc') }}"
    # Director = management host (same IP): the commands run on that host, without a second ssh.
    director_prefix: >-
      {{ cfg.director.command | default('bash -c' if cfg.director.host == cfg.mgmt.host else
         'ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p '
         ~ (cfg.director.port | default(22)) ~ ' '
         ~ ((cfg.director.user ~ '@' ~ cfg.director.host) | quote)) }}

- name: Register the OpenStack management host
  ansible.builtin.add_host:
    name: mgmt
    ansible_host: "{{ cfg.mgmt.host }}"
    ansible_port: "{{ cfg.mgmt.port | default(22) }}"
    ansible_user: "{{ cfg.mgmt.user | default(omit) }}"
    ansible_ssh_private_key_file: "{{ cfg.mgmt.private_key | default(omit) }}"
    ansible_connection: "{{ cfg.mgmt.connection | default('ssh') }}"
    ansible_ssh_use_tty: false
    ansible_ssh_common_args: "{{ cfg.mgmt.ssh_args | default('-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4') }}"
  changed_when: false
