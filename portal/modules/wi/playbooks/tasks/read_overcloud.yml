# Fixed read commands on the overcloud nodes, run from the director (ssh heat-admin / tripleo-admin to each ctlplane
# address, one ssh per command; see wi_analysis/overcloud.py), in ONE connection to the director.
- name: "Overcloud nodes (read-only): {{ wi_reads.overcloud.keys() | join(', ') }}"
  ansible.builtin.raw: "{{ director_prefix }} {{ (wi_reads.overcloud | wi_oc_script) | quote }}"
  delegate_to: mgmt
  register: os_out
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: "Check result: director connection"
  vars:
    os_err: >-
      {{ ((os_out.stderr | default('') | trim) or (os_out.msg | default('') | trim)).splitlines()
         | map('trim') | reject('search', 'Permanently added|post-quantum|store now, decrypt later|may need to be upgraded')
         | map('regex_replace', '^Task failed: Failed to connect to the host via ssh: ', '') | select | join(' ') }}
    director_denied: "{{ ('@' ~ cfg.director.host ~ ': Permission denied') in os_err }}"
  ansible.builtin.assert:
    that:
      - not (os_out.unreachable | default(false))
      - "'@@WI@@begin' in (os_out.stdout | default(''))"
    fail_msg: >-
      {% if os_out.unreachable | default(false) %}Management host {{ cfg.mgmt.host }} is not reachable: {{ os_err | truncate(400) }}
      {% elif director_denied | bool %}Management host {{ cfg.mgmt.host }} is reachable, but the login to director
      {{ cfg.director.user }}@{{ cfg.director.host }} was denied (Permission denied).
      {% else %}The commands on the overcloud nodes did not run: {{ (os_err or (os_out.stdout | default(''))) | truncate(500) }}{% endif %}
    quiet: true

- name: "Record: {{ wi_reads.overcloud.keys() | join(', ') }}"
  ansible.builtin.set_fact:
    wi_data: "{{ wi_data | combine(os_out.stdout | default('') | wi_batch(wi_reads.overcloud.keys() | list)) }}"
