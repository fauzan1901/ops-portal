# Write the result (JSON) for the portal, and a summary for whoever reads the log.
- name: Write job result
  ansible.builtin.copy:
    content: "{{ job_result | to_nice_json }}"
    dest: "{{ result_file }}"
    mode: "0600"
  when: result_file | default('') | length > 0

- name: Summary
  ansible.builtin.debug:
    msg: >-
      {{ (job_result.status | upper ~ ': ' ~ job_result.summary) if job_result.ok | default(false)
         else 'FAILED at step "' ~ (job_result.step | default('')) ~ '": ' ~ job_result.error }}
